server:
  port: 9999

spring:
  redis:
    host: wsl
    port: 6379
    jedis:
      pool:
        max-active: 8
        max-wait: 1000ms
        max-idle: 500
        min-idle: 0
    lettuce:
      shutdown-timeout: 0
  data:
    mongodb:
      host: wsl
      port: 27017
      database: notice
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://wsl:3306/hitch?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    druid:
      initial-size: 10
      min-idle: 20
      max-active: 100
      max-wait: 60000
  rabbitmq:
    host: wsl
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v1
    vectorstore:
      redis:
        index: hitch-knowledge
        prefix: "doc:"

# MinIO
minio:
  url: http://wsl:9005
  host: wsl
  port: 9005
  bucket: hitch
  username: minioadmin
  password: minioadmin

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.heima.modules.po
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

